<section class="confirm">
  <div class="confirm__container">
    <ak-section-heading title="Thank you." subtitle="Your diamond journey has begun." />
    <p class="confirm__id">Order #{{ orderId }}</p>
    <p class="confirm__text">A confirmation has been sent to your email. Our team will reach out shortly with next steps, including insurance and delivery details.</p>
    <div class="confirm__actions">
      <a akButton variant="primary" routerLink="/account">View Order</a>
      <a akButton variant="ghost" routerLink="/consultation">Speak With an Expert</a>
    </div>
  </div>
</section>
